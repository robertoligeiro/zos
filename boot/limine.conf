timeout: 0
serial: yes
serial_baudrate: 115200

/ZOS - Zombie OS
    protocol: limine
    path: boot():/boot/zos.elf
    module_path: boot():/boot/echo-server.elf
    module_cmdline: echo-server
    module_path: boot():/boot/echo-client.elf
    module_cmdline: echo-client
    module_path: boot():/boot/fault-probe.elf
    module_cmdline: fault-probe
    module_path: boot():/boot/console-server.elf
    module_cmdline: console-server
    module_path: boot():/boot/input-server.elf
    module_cmdline: input-server
    module_path: boot():/boot/tty-server.elf
    module_cmdline: tty-server
    module_path: boot():/boot/blkdev-server.elf
    module_cmdline: blkdev-server
    module_path: boot():/boot/fs-simple-server.elf
    module_cmdline: fs-simple-server
    module_path: boot():/boot/vfs-server.elf
    module_cmdline: vfs-server
    module_path: boot():/boot/storage-probe.elf
    module_cmdline: storage-probe
    resolution: 1024x768x32
    kaslr: no
    paging_mode: 4level
