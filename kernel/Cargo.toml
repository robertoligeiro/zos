[package]
name = "zos-kernel"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zos-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
test-boot = []
test-divide = []
test-page-fault = []
test-memory = []
test-memory-protection = []
test-memory-unmap = []
test-memory-execute = []
test-ipc = []
test-console = []
test-fs-create = []
test-fs-read = []
test-shell = []

[dependencies]
limine = "=0.6.5"
x86_64 = "=0.15.2"
spin = "=0.9.9"
font8x8 = { version = "=0.3.1", default-features = false, features = ["unicode"] }
linked_list_allocator = { version = "=0.10.5", default-features = false }
zos-libos = { path = "../libos" }
